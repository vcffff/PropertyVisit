# Reviewed user-supplied square PNGs. Regenerate: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/launcher_icons/app_icon.png
  image_path_android: assets/launcher_icons/app_icon.png
  image_path_ios: assets/launcher_icons/app_icon.png
  remove_alpha_ios: true
  background_color_ios: "#163E71"
  adaptive_icon_background: "#163E71"
  adaptive_icon_foreground: assets/launcher_icons/app_icon_foreground.png
  # Foreground already has ~25% transparent side padding. A small extra inset
  # keeps the complete house/pin inside the 66dp safe circle; avoid double-padding.
  adaptive_icon_foreground_inset: 4
  min_sdk_android: 21
